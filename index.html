<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Veltrox CRM</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f4f7fb;
}

.container{
    display:flex;
    min-height:100vh;
}

.sidebar{
    width:250px;
    background:#111827;
    color:white;
    padding:20px;
}

.sidebar h2{
    margin-bottom:30px;
}

.sidebar ul{
    list-style:none;
}

.sidebar ul li{
    padding:15px;
    margin-bottom:10px;
    background:#1f2937;
    border-radius:10px;
    cursor:pointer;
}

.sidebar ul li:hover{
    background:#2563eb;
}

.main{
    flex:1;
    padding:25px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.search{
    padding:12px;
    width:300px;
    border:1px solid #ccc;
    border-radius:10px;
}

.btn{
    background:#2563eb;
    color:white;
    border:none;
    padding:12px 18px;
    border-radius:10px;
    cursor:pointer;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:25px;
}

.card{
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

.table-container{
    background:white;
    padding:20px;
    border-radius:15px;
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

table th,
table td{
    padding:12px;
    border-bottom:1px solid #ddd;
    text-align:left;
}

.modal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
    justify-content:center;
    align-items:center;
}

.modal-content{
    background:white;
    width:600px;
    padding:25px;
    border-radius:15px;
}

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;
    margin-bottom:5px;
    font-weight:bold;
}

.form-group input,
.form-group select,
.form-group textarea{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:10px;
}

.action-buttons{
    margin-top:20px;
    display:flex;
    justify-content:flex-end;
    gap:10px;
}

</style>
</head>

<body>

<div class="container">

<div class="sidebar">

<h2>Veltrox CRM</h2>

<ul>
<li onclick="showModule('dashboard')">Dashboard</li>
<li onclick="showModule('customers')">Customer Master</li>
<li onclick="showModule('leads')">Sales Leads</li>
<li onclick="showModule('service')">Service Tickets</li>
<li onclick="showModule('followups')">Follow-ups</li>
<li onclick="showModule('invoice')">Tax Invoice</li>
</ul>

</div>

<div class="main">

<div class="topbar">

<div>
<h1 id="moduleTitle">Dashboard</h1>
<p>Sales, Service and Reminder CRM</p>
</div>

<div>
<input type="text" class="search" placeholder="Search...">
<button class="btn" onclick="openModal()">+ Add</button>
</div>

</div>

<div class="cards">

<div class="card">
<h3>Total Customers</h3>
<h1 id="totalCustomers">0</h1>
</div>

<div class="card">
<h3>Total Leads</h3>
<h1 id="totalLeads">0</h1>
</div>

<div class="card">
<h3>Open Tickets</h3>
<h1 id="totalTickets">0</h1>
</div>

<div class="card">
<h3>Invoices</h3>
<h1 id="totalInvoices">0</h1>
</div>

</div>

<div class="table-container">

<table>

<thead id="tableHead">

<tr>
<th>ID</th>
<th>Name</th>
<th>Status</th>
<th>Action</th>
</tr>

</thead>

<tbody id="tableBody">

</tbody>

</table>

</div>

</div>

</div>

<div class="modal" id="modal">

<div class="modal-content">

<h2>Add Record</h2>

<div class="form-group">
<label>Customer Name</label>
<input type="text" id="customerName">
</div>

<div class="form-group">
<label>Company Name</label>
<input type="text" id="companyName">
</div>

<div class="form-group">
<label>Mobile Number</label>
<input type="text" id="mobileNo">
</div>

<div class="form-group">
<label>Status</label>

<select id="status">
<option>New</option>
<option>Pending</option>
<option>Closed</option>
</select>

</div>

<div class="action-buttons">

<button class="btn" onclick="saveRecord()">Save</button>

<button class="btn" style="background:#6b7280;" onclick="closeModal()">
Cancel
</button>

</div>

</div>

</div>

<script>

let currentModule = "dashboard";

let records = [];

function showModule(module){

currentModule = module;

document.getElementById("moduleTitle").innerText = module.toUpperCase();

}

function openModal(){

document.getElementById("modal").style.display = "flex";

}

function closeModal(){

document.getElementById("modal").style.display = "none";

}

function saveRecord(){

let customerName = document.getElementById("customerName").value;

let companyName = document.getElementById("companyName").value;

let mobileNo = document.getElementById("mobileNo").value;

let status = document.getElementById("status").value;

if(customerName == ""){

alert("Please enter customer name");

return;

}

let tableBody = document.getElementById("tableBody");

let row = tableBody.insertRow();

row.innerHTML = `
<td>${records.length + 1}</td>
<td>${customerName}</td>
<td>${status}</td>
<td>
<button onclick="editRow(this)">Edit</button>
<button onclick="deleteRow(this)">Delete</button>
</td>
`;

records.push({
customerName,
companyName,
mobileNo,
status
});

document.getElementById("totalCustomers").innerText = records.length;

closeModal();

}

function deleteRow(button){

button.parentElement.parentElement.remove();

}

function editRow(button){

alert("Edit functionality will be added in next version");

}

</script>

</body>
</html>
