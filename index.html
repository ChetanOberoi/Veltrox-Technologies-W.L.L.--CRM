<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />

<title>Veltrox CRM</title>
<style>
:root{
  --bg:#f5f7fb;--panel:#fff;--text:#111827;--muted:#6b7280;--border:#e5e7eb;
  --primary:#2563eb;--primary2:#1d4ed8;--dark:#0f172a;--dark2:#1e293b;
  --green:#16a34a;--orange:#f59e0b;--red:#dc2626;--purple:#7c3aed;--cyan:#0891b2;
  --shadow:0 10px 28px rgba(15,23,42,.08);
}
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font-family:inherit}
.app{display:flex;min-height:100vh}
.sidebar{width:280px;background:linear-gradient(180deg,#eff6ff,#dbeafe);color:#0f172a;position:fixed;inset:0 auto 0 0;padding:22px 16px;overflow:auto;border-right:1px solid #bfdbfe}
.brand{font-size:24px;font-weight:900;letter-spacing:.2px;color:#1e3a8a}.brand-sub{font-size:12px;color:#64748b;margin:5px 0 22px}
.group-title{font-size:11px;text-transform:uppercase;color:#93a8c9;margin:18px 10px 6px;font-weight:800;letter-spacing:.8px}
.nav{width:100%;border:0;background:transparent;color:#1e3a5f;text-align:left;padding:11px 12px;border-radius:11px;margin:3px 0;cursor:pointer;font-weight:700;display:flex;gap:9px;align-items:center}
.nav:hover{background:#fff;color:#1d4ed8}
.nav.active{background:var(--primary);color:#fff}
.main{margin-left:280px;width:calc(100% - 280px);padding:14px}
.topbar{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:6px}
h1{margin:0 0 2px;font-size:28px}.sub{margin:0;color:var(--muted);font-size:14px}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.search{width:330px;max-width:100%;padding:11px 13px;border:1px solid #d1d5db;border-radius:12px;outline:none;background:#fff}.search:focus{border-color:var(--primary)}
.btn{border:0;border-radius:10px;padding:10px 13px;background:var(--primary);color:#fff;font-weight:800;cursor:pointer}.btn:hover{opacity:.9}.btn.small{padding:7px 9px;font-size:12px}.btn.gray{background:#64748b}.btn.green{background:var(--green)}.btn.orange{background:var(--orange)}.btn.red{background:var(--red)}.btn.purple{background:var(--purple)}.btn.cyan{background:var(--cyan)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:13px;margin-bottom:12px}.card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:16px;box-shadow:var(--shadow)}.card.click{cursor:pointer}.card.click:hover{transform:translateY(-2px)}.card-title{font-size:12px;color:var(--muted);font-weight:800}.card-value{font-size:25px;font-weight:900;margin-top:7px}.card-foot{font-size:11px;color:var(--muted);margin-top:6px}
.grid-2{display:grid;grid-template-columns:1.5fr .8fr;gap:16px}.panel{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:var(--shadow);margin-bottom:12px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.panel h2,.panel h3{margin:0}.hint{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;border-radius:12px;padding:11px;margin-bottom:8px;font-size:13px}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1100px}th,td{padding:10px;border-bottom:1px solid var(--border);text-align:left;font-size:13px;vertical-align:top}th{background:#f8fafc;color:#334155;white-space:nowrap}tr:hover td{background:#fafafa}.link{color:var(--primary);font-weight:800;cursor:pointer;text-decoration:none}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:900;background:#dbeafe;color:#1d4ed8}.b-green{background:#dcfce7;color:#166534}.b-red{background:#fee2e2;color:#991b1b}.b-orange{background:#fef3c7;color:#92400e}.b-gray{background:#e5e7eb;color:#374151}.b-purple{background:#ede9fe;color:#5b21b6}
.kanban{display:grid;grid-template-columns:repeat(7,minmax(220px,1fr));gap:12px;overflow:auto;padding-bottom:6px}.kanban.service{grid-template-columns:repeat(6,minmax(220px,1fr))}.kanban.pay{grid-template-columns:repeat(4,minmax(230px,1fr))}.lane{background:#f8fafc;border:1px solid var(--border);border-radius:16px;padding:10px;min-height:280px}.lane-title{font-weight:900;font-size:13px;margin:3px 4px 10px;display:flex;justify-content:space-between}.kcard{background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 6px 14px rgba(15,23,42,.06)}.kcard b{display:block;margin-bottom:5px}.kmeta{font-size:12px;color:var(--muted);line-height:1.55}.k-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.tab{border:1px solid var(--border);background:#fff;color:#334155;border-radius:999px;padding:8px 12px;cursor:pointer;font-weight:800}.tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:1000;align-items:center;justify-content:center;padding:14px}.drawer{background:#fff;width:980px;max-width:100%;max-height:94vh;overflow:auto;border-radius:20px;padding:22px}.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.modal-head h2{margin:0}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.full{grid-column:1/-1}label{display:block;font-size:12px;font-weight:900;color:#374151;margin:0 0 5px}input,select,textarea{width:100%;padding:10px 11px;border:1px solid #d1d5db;border-radius:10px;background:#fff}textarea{min-height:78px;resize:vertical}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.quick-toolbar{display:inline-flex;gap:4px;background:#f3f4f6;padding:4px;border-radius:10px;margin-bottom:14px}
.qtb-btn{background:transparent;border:0;padding:8px 12px;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;color:#374151;cursor:pointer;border-radius:7px;white-space:nowrap}
.qtb-btn:hover{background:#fff;color:#1f2937}
.qtb-btn.danger:hover{background:#fee2e2;color:#991b1b}
.customer-head{display:grid;grid-template-columns:1fr auto;gap:12px}.timeline{border-left:3px solid #dbeafe;margin-left:8px;padding-left:16px}.event{position:relative;margin-bottom:13px}.event:before{content:"";position:absolute;left:-25px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--primary)}

/* ═══════════════════════════════════════════════════════════ */
/* NEW DASHBOARD STYLES — CARD-BASED HOME                    */
/* ═══════════════════════════════════════════════════════════ */
.dash-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.dash-title{margin:0;font-size:32px;font-weight:900}
.dash-customize-btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;background:#e5e7eb;border:0;border-radius:10px;color:#374151;font-weight:800;font-size:13px;cursor:pointer}
.dash-customize-btn:hover{background:#d1d5db}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:28px}
.kpi-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:0 2px 8px rgba(15,23,42,.05);text-align:center}
.kpi-label{font-size:12px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.kpi-value{font-size:32px;font-weight:900;color:var(--primary);margin:0;line-height:1}
.kpi-subtext{font-size:11px;color:var(--muted);margin-top:6px}

.module-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-bottom:28px}
.module-card{background:var(--panel);border:1.5px solid var(--border);border-radius:16px;padding:20px;cursor:pointer;transition:all .2s;box-shadow:0 2px 8px rgba(15,23,42,.05);text-align:center}
.module-card:hover{transform:translateY(-4px);box-shadow:0 6px 16px rgba(15,23,42,.12);border-color:var(--primary)}
.module-icon{font-size:40px;margin-bottom:10px}
.module-name{font-size:14px;font-weight:900;color:var(--text);margin:0}
.module-desc{font-size:11px;color:var(--muted);margin-top:4px}

.customize-modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:2000;align-items:center;justify-content:center;padding:16px}
.customize-panel{background:var(--panel);border-radius:20px;padding:24px;max-width:480px;width:100%;max-height:80vh;overflow:auto;box-shadow:0 20px 50px rgba(15,23,42,.2)}
.customize-panel h2{margin:0 0 16px;font-size:20px}
.customize-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;margin-bottom:8px;cursor:pointer;background:#f9fafb}
.customize-item:hover{background:#eff6ff}
.customize-item input{width:18px;height:18px;cursor:pointer;accent-color:var(--primary)}
.customize-item label{margin:0;flex:1;cursor:pointer;font-size:14px;font-weight:700}
.customize-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}

@media(max-width:950px){.sidebar{position:relative;width:100%;height:auto}.app{display:block}.main{margin-left:0;width:100%;padding:14px}.topbar,.grid-2,.customer-head{display:block}.actions{justify-content:flex-start;margin-top:10px}.form-grid{grid-template-columns:1fr}.kanban,.kanban.service,.kanban.pay{grid-template-columns:repeat(1,1fr)}.kpi-grid{grid-template-columns:repeat(2,1fr)}.module-grid{grid-template-columns:repeat(2,1fr)}.dash-title{font-size:24px}}
@media(max-width:640px){.kpi-grid{grid-template-columns:1fr}.module-grid{grid-template-columns:1fr}}

/* ──── HYBRID SALES PIPELINE STYLES ──── */
.pipeline-kpi-card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:14px;box-shadow:0 2px 6px rgba(15,23,42,.05);transition:all .2s}
.pipeline-kpi-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(15,23,42,.1)}
.lead-card-item{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:14px;box-shadow:0 2px 8px rgba(15,23,42,.05);transition:all .2s}
.lead-card-item:hover{border-color:#2563eb;box-shadow:0 4px 14px rgba(37,99,235,.12)}

#printArea{display:none}
@media print{
  @page{size:A4;margin:12mm}
  html,body{background:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;width:auto!important;margin:0!important;padding:0!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;position:static;width:186mm!important;max-width:186mm!important;margin:0!important;padding:0!important;box-sizing:border-box;font-size:12px;background:#fff!important;overflow:hidden!important}
  #printArea>div{width:186mm!important;max-width:186mm!important;overflow:hidden!important}
  #printArea table{width:100%!important;min-width:0!important;max-width:186mm!important;table-layout:fixed!important;word-wrap:break-word;border-spacing:0}
  #printArea *{box-sizing:border-box;max-width:100%}
  #printArea th,#printArea td{white-space:normal!important;overflow-wrap:break-word;word-break:break-word}
  #printArea img{max-width:100%!important;height:auto}
  #printArea div[style*="display:flex"],#printArea div[style*="display: flex"]{flex-wrap:wrap}
  .no-print{display:none!important}
}

#fbOverlay{position:fixed;inset:0;background:#f5f7fb;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;color:#0f172a}
.fb-spinner{width:40px;height:40px;border:4px solid #dbeafe;border-top-color:#2563eb;border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:20px}
@keyframes spin{to{transform:rotate(360deg)}}

#syncIndicator{position:fixed;bottom:16px;right:16px;background:#fff;color:#334155;border:1px solid #e5e7eb;border-radius:12px;padding:8px 14px;font-size:12px;font-weight:700;z-index:9998;display:flex;align-items:center;gap:7px;box-shadow:0 4px 16px rgba(15,23,42,.1);transition:all .3s}
#syncIndicator.syncing{background:#1d4ed8;color:#fff;border-color:#1d4ed8}
#syncIndicator.success{background:#15803d;color:#fff;border-color:#15803d}
#syncIndicator.error{background:#dc2626;color:#fff;border-color:#dc2626}
#syncDot{width:8px;height:8px;border-radius:50%;background:#94a3b8}
#syncIndicator.syncing #syncDot{background:#93c5fd;animation:pulse 1s infinite}
#syncIndicator.success #syncDot{background:#86efac}
#syncIndicator.error #syncDot{background:#fca5a5}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

#loginScreen{position:fixed;inset:0;background:linear-gradient(135deg,#eff6ff 0%,#dbeafe 50%,#e0e7ff 100%);display:flex;align-items:center;justify-content:center;z-index:99998}
#loginBox{background:#fff;border-radius:24px;padding:40px;width:400px;max-width:95vw;box-shadow:0 20px 50px rgba(30,58,138,.15);border:1px solid #e5e7eb}
#loginBox .lb-logo{font-size:40px;text-align:center;margin-bottom:8px}
#loginBox .lb-title{font-size:22px;font-weight:900;text-align:center;color:#0f172a;margin-bottom:4px}
#loginBox .lb-sub{font-size:13px;color:#6b7280;text-align:center;margin-bottom:28px}
#loginBox .lb-label{font-size:12px;font-weight:800;color:#374151;margin-bottom:5px;display:block}
#loginBox .lb-input{width:100%;padding:11px 14px;border:1.5px solid #e5e7eb;border-radius:10px;font-size:14px;outline:none;box-sizing:border-box;margin-bottom:14px;font-family:inherit}
#loginBox .lb-input:focus{border-color:#2563eb}
#loginBox .lb-btn{width:100%;padding:13px;background:#2563eb;color:#fff;border:0;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit}
#loginBox .lb-btn:hover{background:#1d4ed8}
#loginBox .lb-btn:disabled{background:#93c5fd;cursor:not-allowed}
#loginBox .lb-err{background:#fee2e2;color:#991b1b;border-radius:10px;padding:10px 14px;font-size:13px;font-weight:700;margin-bottom:14px;display:none}
</style>

</head>
<body>

<div id="fbOverlay" style="display:flex"><div class="fb-spinner"></div><div>Loading CRM...</div></div>
<div id="loginScreen" style="display:none">
  <div id="loginBox">
    <div class="lb-logo">📋</div>
    <h1 class="lb-title">Veltrox CRM</h1>
    <p class="lb-sub">Sign in to continue</p>
    <div id="loginErr" class="lb-err"></div>
    <label class="lb-label">Email</label>
    <input type="email" id="loginEmail" class="lb-input" autocomplete="email" autofocus>
    <label class="lb-label">Password</label>
    <input type="password" id="loginPass" class="lb-input" autocomplete="current-password">
    <button id="loginBtn" class="lb-btn" onclick="doLogin()">Login to CRM</button>
    <p style="font-size:12px;text-align:center;color:#9ca3af;margin-top:14px">
      <a onclick="doForgotPassword()" style="color:#2563eb;cursor:pointer;text-decoration:none">Forgot password?</a>
    </p>
  </div>
</div>

<div class="app" id="crmApp" style="display:none">
  <div class="sidebar">
    <div class="brand">🚀 VELTROX</div>
    <div class="brand-sub">CRM Dashboard</div>
    <button class="nav active" id="nav-dashboard" onclick="showDashboard()">📊 Dashboard</button>
    <div class="group-title">Sales</div>
    <button class="nav" id="nav-leads" onclick="showModule('leads')">🔵 Leads</button>
    <button class="nav" id="nav-followups" onclick="showModule('followups')">📞 Follow-ups</button>
    <button class="nav" id="nav-customers" onclick="showModule('customers')">👥 Customers</button>
    <button class="nav" id="nav-quotations" onclick="showModule('quotations')">📄 Quotations</button>
    <div class="group-title">Service</div>
    <button class="nav" id="nav-tickets" onclick="showModule('tickets')">🎫 Service Tickets</button>
    <button class="nav" id="nav-renewals" onclick="showModule('renewals')">♻️ Renewals</button>
    <div class="group-title">Finance</div>
    <button class="nav" id="nav-invoices" onclick="showModule('invoices')">📑 Invoices</button>
    <button class="nav" id="nav-payments" onclick="showModule('payments')">💳 Payments</button>
    <div class="group-title">Masters</div>
    <button class="nav" id="nav-products" onclick="showModule('products')">📦 Products</button>
    <button class="nav" id="nav-services" onclick="showModule('services')">🛠️ Services</button>
    <button class="nav" id="nav-team" onclick="showModule('team')">👨‍💼 Team</button>
    <button class="nav" id="nav-issueCategories" onclick="showModule('issueCategories')">🏷️ Issue Categories</button>
    <div class="group-title">Reports & Settings</div>
    <button class="nav" id="nav-reports" onclick="showModule('reports')">📈 Reports</button>
    <button class="nav" id="nav-settings" onclick="showModule('settings')">⚙️ Settings</button>
    <hr style="border:0;border-top:1px solid #bfdbfe;margin:12px 0">
    <div style="font-size:11px;color:#64748b;padding:10px 6px;line-height:1.6">
      <div id="userDisplayName" style="font-weight:900">User</div>
      <span id="userRoleBadge" style="display:inline-block;margin:4px 0;background:#374151;color:#e5e7eb;border-radius:6px;padding:2px 9px;font-size:10px;font-weight:800">Role</span>

  <div class="main">

        <h1 id="sectionTitle">Dashboard</h1>

    <div id="content"></div>

</div>

<div id="syncIndicator">
  <div id="syncDot"></div>
  <span id="syncText">Ready</span>
</div>

<script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.min.js"></script>
<script>

// ═══════════════════════════════════════════════════════════════════
// FIREBASE INITIALIZATION
// ═══════════════════════════════════════════════════════════════════
const firebaseConfig={apiKey:"AIzaSyDh-WYcb5yZq_h8bP3D8cKvJVQHxLf0Qs0",authDomain:"veltrox-crm-b48b9.firebaseapp.com",projectId:"veltrox-crm-b48b9",storageBucket:"veltrox-crm-b48b9.appspot.com",messagingSenderId:"834717089597",appId:"1:834717089597:web:c1c0b0aa1bcb9891fb93cd"};
firebase.initializeApp(firebaseConfig);
const fauth=firebase.auth();
const fdb=firebase.firestore();

// Purge localStorage on load (security)
try{localStorage.clear();}catch(e){}

let db={leads:[],customers:[],tickets:[],invoices:[],quotations:[],payments:[],renewals:[],products:[],services:[],team:[],issueCategories:[],settings:{}};

// ═══════════════════════════════════════════════════════════════════
// AUTH & DATA LOADING
// ═══════════════════════════════════════════════════════════════════
function hideLoadingOverlay(){setTimeout(()=>{document.getElementById('fbOverlay').style.display='none';},200);}
function showLogin(){document.getElementById('loginScreen').style.display='flex';document.getElementById('crmApp').style.display='none';hideLoadingOverlay();}
function showApp(){document.getElementById('loginScreen').style.display='none';document.getElementById('crmApp').style.display='flex';hideLoadingOverlay();}

const FB_MODULES=['leads','customers','tickets','invoices','quotations','payments','renewals','products','services','team','issueCategories'];
function normalizeDB(firebaseData){
  const fresh={leads:[],customers:[],tickets:[],invoices:[],quotations:[],payments:[],renewals:[],products:[],services:[],team:[],issueCategories:[],settings:{}};
  if(firebaseData)FB_MODULES.forEach(m=>{fresh[m]=(firebaseData[m]||[]).filter(x=>x);});
  return fresh;
}

async function loadDBFromFirebase(){
  const docSnap=await fdb.collection('crm_data').doc(crmSafeId(fauth.currentUser.email)).get();
  return docSnap.exists?docSnap.data():{};
}

async function saveFBModule(module,data,ts){
  await fdb.collection('crm_data').doc(crmSafeId(fauth.currentUser.email)).set({[module]:data||[]},{merge:true});
}

fauth.onAuthStateChanged(async u=>{
  if(u){
    initCRMPermissions();
    try{
      const fbData=await loadDBFromFirebase();
      db=normalizeDB(fbData);
    }catch(e){console.warn('Load error:',e);}
    showApp();
    showDashboard();
  }else{
    showLogin();
  }
});

// ═══════════════════════════════════════════════════════════════════
// AUTH FUNCTIONS
// ═══════════════════════════════════════════════════════════════════
function doLogin(){
  const email=document.getElementById('loginEmail').value.trim();
  const pass=document.getElementById('loginPass').value;
  const btn=document.getElementById('loginBtn');
  const err=document.getElementById('loginErr');
  if(!email||!pass){err.style.display='block';err.textContent='Please enter email and password';return;}
  btn.disabled=true;btn.textContent='Logging in...';err.style.display='none';
  fauth.setPersistence(firebase.auth.Auth.Persistence.SESSION)
    .then(()=>fauth.signInWithEmailAndPassword(email,pass))
    .then(()=>{btn.disabled=false;btn.textContent='Login to CRM';})
    .catch(e=>{
      btn.disabled=false;btn.textContent='Login to CRM';
      err.style.display='block';
      if(e.code==='auth/user-not-found'||e.code==='auth/wrong-password'||e.code==='auth/invalid-credential')err.textContent='Wrong email or password.';
      else if(e.code==='auth/too-many-requests')err.textContent='Too many attempts. Try later.';
      else err.textContent='Login failed: '+e.message;
    });
}
function doLogout(){if(confirm('Logout?')){fauth.signOut().then(()=>{showLogin();});}}
function doForgotPassword(){
  const email=document.getElementById('loginEmail').value.trim();
  const err=document.getElementById('loginErr');
  if(!email){err.style.display='block';err.textContent='Enter your email first.';return;}
  err.style.display='none';
  fauth.sendPasswordResetEmail(email).then(()=>{alert('Reset link sent to '+email);}).catch(e=>{err.style.display='block';err.textContent=e.message;});
}

const CRM_ADMIN_EMAILS=['chetan@veltrox.com','chetan.oberoi@veltrox.com','admin@veltrox.com','chetanbr1234@gmail.com'];
let crmCurrentUser={email:'',name:'',role:'Admin',permissions:{}};
function crmSafeId(email){return String(email).replace(/[^a-zA-Z0-9_-]/g,'_').slice(0,100);}
const CRM_ROLE_DEFAULTS={
  Admin:{dashboard:true,leads:true,followups:true,customers:true,quotations:true,tickets:true,renewals:true,invoices:true,payments:true,products:true,services:true,team:true,issueCategories:true,reports:true,settings:true},
  Sales:{dashboard:true,leads:true,followups:true,customers:true,quotations:true,tickets:false,renewals:true,invoices:false,payments:false,products:true,services:true,team:true,issueCategories:true,reports:true,settings:false},
  Finance:{dashboard:true,leads:false,followups:false,customers:true,quotations:true,tickets:false,renewals:false,invoices:true,payments:true,products:false,services:false,team:false,issueCategories:false,reports:true,settings:false},
  'IT Support':{dashboard:true,leads:false,followups:false,customers:true,quotations:false,tickets:true,renewals:false,invoices:false,payments:false,products:false,services:true,team:false,issueCategories:true,reports:false,settings:false}
};
function crmCan(module){if(crmCurrentUser.role==='Admin')return true;return (crmCurrentUser.permissions||{})[module]===true;}
function applyCRMPermissions(){
  const navMap={dashboard:'dashboard',leads:'leads',followups:'followups',customers:'customers',quotations:'quotations',tickets:'tickets',renewals:'renewals',invoices:'invoices',payments:'payments',products:'products',services:'services',team:'team',issueCategories:'issueCategories',reports:'reports',settings:'settings'};
  Object.entries(navMap).forEach(([mod,navId])=>{const btn=document.getElementById('nav-'+navId);if(btn)btn.style.display=crmCan(mod)?'':'none';});
}

async function initCRMPermissions(){
  try{
    const u=fauth.currentUser;
    const isAdmin=CRM_ADMIN_EMAILS.includes(u.email);
    crmCurrentUser={email:u.email,name:u.displayName||u.email,role:'Admin',permissions:CRM_ROLE_DEFAULTS.Admin};
    if(!isAdmin){
      try{
        const pSnap=await fdb.collection('crm_users').doc(crmSafeId(u.email)).get();
        const p=pSnap.data()||{};
        crmCurrentUser.role=p.role||'IT Support';
        crmCurrentUser.permissions=p.permissions||CRM_ROLE_DEFAULTS[p.role||'IT Support']||{};
      }catch(e2){console.warn('perm update error',e2);}
    }
    document.getElementById('userDisplayName').textContent=crmCurrentUser.name;
    const rb=document.getElementById('userRoleBadge');
    rb.textContent=crmCurrentUser.role;
    const rc={'Admin':'background:#1e40af;color:#bfdbfe','Sales':'background:#166534;color:#bbf7d0','Finance':'background:#92400e;color:#fef3c7','IT Support':'background:#5b21b6;color:#ede9fe'};
    rb.style.cssText='border-radius:6px;padding:2px 9px;font-size:11px;font-weight:800;'+(rc[crmCurrentUser.role]||'background:#374151;color:#e5e7eb');
    applyCRMPermissions();
  }catch(e){console.warn('permission init error',e);}
}

// Dashboard module visibility (stored in settings)
const DEFAULT_MODULES={dashboard:true,tickets:true,customers:true,invoices:true,renewals:true,quotations:true,leads:true,products:true};

function getVisibleModules(){
  return db.settings.dashboardModules||DEFAULT_MODULES;
}

function saveModuleVisibility(modules){
  db.settings.dashboardModules=modules;
  saveDB();
}

    {key:'customers',name:'Customers',icon:'👥',action:'showModule("customers")'},

  let html=`
    <div class="dash-header">
      <h2 class="dash-title">Welcome to Veltrox</h2>
      <button class="dash-customize-btn" onclick="openCustomizeDashboard()">⚙️ Customize</button>

    <div class="kpi-grid">
      <div class="kpi-card">

function openCustomizeDashboard(){
  const visModules=getVisibleModules();
  const moduleList=[
    {key:'tickets',name:'Service Tickets',icon:'🎫'},
    {key:'customers',name:'Customers',icon:'👥'},
    {key:'invoices',name:'Invoices',icon:'📑'},
    {key:'renewals',name:'Renewals',icon:'♻️'},
    {key:'quotations',name:'Quotations',icon:'📄'},
    {key:'leads',name:'Leads',icon:'🔵'},
    {key:'payments',name:'Payments',icon:'💳'},
    {key:'products',name:'Products',icon:'📦'},
    {key:'reports',name:'Reports',icon:'📈'},
    {key:'settings',name:'Settings',icon:'⚙️'}
  ].filter(m=>crmCan(m.key));

  let html=`<h2>Customize Dashboard</h2>`;
  html+=moduleList.map(m=>`
    <div class="customize-item">
      <input type="checkbox" id="cm_${m.key}" ${visModules[m.key]!==false?'checked':''} onchange="updateModuleVisibility('${m.key}',this.checked)">
      <label for="cm_${m.key}">${m.icon} ${m.name}</label>
    </div>
  `).join('');
  html+=`<div class="customize-actions"><button class="btn green small" onclick="closeDashCustomize()">Done</button></div>`;

  document.querySelector('.customize-panel').innerHTML=html;
  document.querySelector('.customize-modal').style.display='flex';
}

function updateModuleVisibility(key,visible){
  const visModules=getVisibleModules();
  visModules[key]=visible;
  saveModuleVisibility(visModules);
}

function closeDashCustomize(){
  document.querySelector('.customize-modal').style.display='none';
  showDashboard(); // Refresh dashboard
}

// SAVE & SYNC
// ═══════════════════════════════════════════════════════════════════

function setSyncStatus(status,msg){
  const el=document.getElementById('syncIndicator');
  const txt=document.getElementById('syncText');
  if(!el||!txt)return;
  el.className=status;
  txt.textContent=msg;
}

function saveDB(){
  if(!fauth.currentUser){alert('Session expired. Please log in again.');return Promise.reject(new Error('Unauthenticated'));}
  const saveTs=Date.now();
  setSyncStatus('syncing','🔄 Syncing...');
  return Promise.all(FB_MODULES.map(m=>saveFBModule(m,db[m],saveTs)))
    .then(()=>{
      const now=new Date();
      const t=now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:true});
      setSyncStatus('success','✅ Synced — '+t);
      console.log('✅ Firebase synced');
    })
    .catch(e=>{
      console.error('Firebase sync error:',e);
      setSyncStatus('error','❌ Sync failed');
      throw e;
    });
}
