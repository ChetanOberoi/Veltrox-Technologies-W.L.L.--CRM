<!DOCTYPE html>
<html>
<head>
<title>Veltrox CRM</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#f3f6fb;
}

.header{
    background:#0b3d91;
    color:white;
    padding:25px;
}

.container{
    padding:25px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.card{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0px 0px 10px #ccc;
}

button{
    background:#0b3d91;
    color:white;
    border:none;
    padding:12px 18px;
    border-radius:8px;
    margin-right:10px;
    cursor:pointer;
}

</style>

</head>

<body>

<div class="header">
<h1>Veltrox Technologies CRM</h1>
<p>Sales | Service | Reminder Dashboard</p>
</div>

<div class="container">

<button>Add Lead</button>
<button>Create Ticket</button>
<button>View Follow-ups</button>

<br><br>

<div class="cards">

<div class="card">
<h2>Total Leads</h2>
<h1>0</h1>
<p>Sales enquiries</p>
</div>

<div class="card">
<h2>Pending Follow-ups</h2>
<h1>0</h1>
<p>Customer follow-ups</p>
</div>

<div class="card">
<h2>Open Tickets</h2>
<h1>0</h1>
<p>Service support</p>
</div>

</div>

</div>

</body>
</html>
