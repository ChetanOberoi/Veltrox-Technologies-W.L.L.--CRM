<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veltrox CRM - Sales, Service & Invoice</title>

<style>
:root{
    --primary:#2563eb;
    --primary-dark:#1d4ed8;
    --dark:#111827;
    --dark-2:#1f2937;
    --bg:#f3f6fb;
    --white:#ffffff;
    --border:#e5e7eb;
    --text:#111827;
    --muted:#6b7280;
    --danger:#dc2626;
    --success:#16a34a;
    --warning:#f59e0b;
    --purple:#7c3aed;
}
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Segoe UI,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
}
.app{display:flex;min-height:100vh}
.sidebar{
    width:280px;
    background:var(--dark);
    color:white;
    padding:24px 18px;
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    overflow-y:auto;
}
.logo{
    font-size:25px;
    font-weight:900;
    margin:0 0 6px;
}
.logo-sub{
    color:#cbd5e1;
    font-size:13px;
    margin-bottom:24px;
}
.nav-btn{
    display:block;
    width:100%;
    padding:13px 14px;
    margin:6px 0;
    color:#d1d5db;
    background:transparent;
    border:0;
    border-radius:10px;
    text-align:left;
    cursor:pointer;
    font-weight:600;
}
.nav-btn:hover,.nav-btn.active{
    background:var(--primary);
    color:white;
}
.main{
    margin-left:280px;
    width:calc(100% - 280px);
    padding:26px;
}
.topbar{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:18px;
    margin-bottom:20px;
}
.topbar h1{margin:0 0 6px;font-size:30px}
.topbar p{margin:0;color:var(--muted)}
.top-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:flex-end;
}
.search{
    width:330px;
    max-width:100%;
    padding:12px 14px;
    border:1px solid #d1d5db;
    border-radius:12px;
    outline:none;
}
.btn{
    border:0;
    border-radius:10px;
    padding:10px 14px;
    background:var(--primary);
    color:white;
    font-weight:700;
    cursor:pointer;
    display:inline-block;
    margin:2px;
}
.btn:hover{opacity:.9}
.btn.small{padding:7px 10px;font-size:12px}
.btn.gray{background:#6b7280}
.btn.red{background:var(--danger)}
.btn.green{background:var(--success)}
.btn.orange{background:var(--warning)}
.btn.purple{background:var(--purple)}
.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
    margin-bottom:20px;
}
.card{
    background:white;
    padding:18px;
    border-radius:18px;
    box-shadow:0 8px 22px rgba(0,0,0,.07);
}
.card-title{
    color:var(--muted);
    font-weight:700;
    font-size:13px;
}
.card-value{
    font-size:29px;
    font-weight:900;
    margin-top:8px;
}
.panel{
    background:white;
    padding:20px;
    border-radius:18px;
    box-shadow:0 8px 22px rgba(0,0,0,.07);
}
.panel-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-bottom:15px;
}
.panel-head h2{margin:0}
.table-wrap{overflow:auto}
table{
    width:100%;
    border-collapse:collapse;
    min-width:1200px;
}
th,td{
    padding:10px;
    border-bottom:1px solid var(--border);
    text-align:left;
    font-size:13px;
    vertical-align:top;
}
th{
    background:#f9fafb;
    color:#374151;
    white-space:nowrap;
}
tr:hover td{background:#fafafa}
.badge{
    padding:5px 9px;
    border-radius:999px;
    font-size:12px;
    font-weight:800;
    display:inline-block;
    background:#dbeafe;
    color:#1d4ed8;
}
.badge.red{background:#fee2e2;color:#b91c1c}
.badge.green{background:#dcfce7;color:#166534}
.badge.yellow{background:#fef3c7;color:#92400e}
.badge.gray{background:#e5e7eb;color:#374151}
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.48);
    z-index:999;
    align-items:center;
    justify-content:center;
    padding:14px;
}
.modal-content{
    background:white;
    width:960px;
    max-width:100%;
    max-height:92vh;
    overflow:auto;
    border-radius:18px;
    padding:24px;
}
.modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-bottom:15px;
}
.modal-head h2{margin:0}
.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:13px;
}
.full{grid-column:1/-1}
label{
    display:block;
    font-size:13px;
    color:#374151;
    font-weight:800;
    margin-bottom:5px;
}
input,select,textarea{
    width:100%;
    padding:10px 11px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-family:inherit;
}
textarea{min-height:78px;resize:vertical}
.form-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:18px;
}
.notice{
    background:#eff6ff;
    border:1px solid #bfdbfe;
    padding:12px;
    border-radius:12px;
    color:#1e40af;
    margin-bottom:14px;
}
.invoice-print{
    background:white;
    padding:34px;
    color:#111827;
}
.invoice-header{
    display:flex;
    justify-content:space-between;
    gap:20px;
    border-bottom:3px solid #111827;
    padding-bottom:16px;
    margin-bottom:18px;
}
.invoice-title{
    font-size:34px;
    font-weight:900;
    text-align:right;
}
.invoice-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
    margin:16px 0;
}
.invoice-box{
    border:1px solid #d1d5db;
    padding:12px;
    border-radius:10px;
}
.right{text-align:right}
.small-text{font-size:12px;color:var(--muted)}
.hidden{display:none}
hr{border:0;border-top:1px solid #e5e7eb;margin:18px 0}
.import-box{
    display:flex;
    gap:8px;
    align-items:center;
    flex-wrap:wrap;
}
@media print{
    body *{visibility:hidden!important}
    #printArea,#printArea *{visibility:visible!important}
    #printArea{
        position:absolute;
        left:0;
        top:0;
        width:100%;
        padding:0;
    }
    .no-print{display:none!important}
}
@media(max-width:900px){
    .app{display:block}
    .sidebar{position:relative;width:100%;height:auto}
    .main{margin-left:0;width:100%;padding:16px}
    .topbar{display:block}
    .top-actions{justify-content:flex-start;margin-top:12px}
    .search{width:100%}
    .form-grid{grid-template-columns:1fr}
    .invoice-header,.invoice-grid{display:block}
}
</style>
</head>

<body>
<div class="app">
    <aside class="sidebar">
        <div class="logo">Veltrox CRM</div>
        <div class="logo-sub">Sales • Service • Follow-up • Tax Invoice</div>

        <button class="nav-btn" id="nav-dashboard" onclick="setModule('dashboard')">Dashboard</button>
        <button class="nav-btn" id="nav-customers" onclick="setModule('customers')">Customer Master</button>
        <button class="nav-btn" id="nav-leads" onclick="setModule('leads')">Sales Leads</button>
        <button class="nav-btn" id="nav-service" onclick="setModule('service')">Service Tickets</button>
        <button class="nav-btn" id="nav-followups" onclick="setModule('followups')">Follow-ups</button>
        <button class="nav-btn" id="nav-invoices" onclick="setModule('invoices')">Tax Invoices</button>
        <button class="nav-btn" id="nav-reports" onclick="setModule('reports')">Reports</button>
        <button class="nav-btn" id="nav-settings" onclick="setModule('settings')">Settings / Backup</button>
    </aside>

    <main class="main">
        <div class="topbar">
            <div>
                <h1 id="pageTitle">Dashboard</h1>
                <p id="pageSubTitle">Veltrox workflow: Customer → Sales / Service → Follow-up → Invoice → History</p>
            </div>

            <div class="top-actions">
                <input class="search" id="searchBox" placeholder="Search customer, lead, ticket, invoice..." onkeyup="render()">
                <button class="btn" id="addBtn" onclick="openForm()">+ Add</button>
                <button class="btn gray" onclick="exportBackup()">Export Backup</button>
            </div>
        </div>

        <div class="cards">
            <div class="card"><div class="card-title">Total Customers</div><div class="card-value" id="cntCustomers">0</div></div>
            <div class="card"><div class="card-title">Total Leads</div><div class="card-value" id="cntLeads">0</div></div>
            <div class="card"><div class="card-title">Open Tickets</div><div class="card-value" id="cntTickets">0</div></div>
            <div class="card"><div class="card-title">Pending Follow-ups</div><div class="card-value" id="cntFollowups">0</div></div>
            <div class="card"><div class="card-title">Tax Invoices</div><div class="card-value" id="cntInvoices">0</div></div>
            <div class="card"><div class="card-title">Invoice Value</div><div class="card-value" id="cntInvoiceValue">0.000</div></div>
        </div>

        <section class="panel">
            <div class="panel-head">
                <h2 id="sectionTitle">Recent Activities</h2>
                <div id="sectionActions"></div>
            </div>
            <div id="content"></div>
        </section>
    </main>
</div>

<div class="modal" id="formModal">
    <div class="modal-content">
        <div class="modal-head">
            <h2 id="formTitle">Add Record</h2>
            <button class="btn gray" onclick="closeForm()">X</button>
        </div>
        <div id="formArea"></div>
        <div class="form-actions">
            <button class="btn gray" type="button" onclick="closeForm()">Cancel</button>
            <button class="btn green" type="button" onclick="saveForm()">Save</button>
        </div>
    </div>
</div>

<div class="modal" id="viewModal">
    <div class="modal-content" id="viewArea"></div>
</div>

<script>
/* ==============================
   DATABASE
================================= */
const STORAGE_KEY = "VELTROX_FULL_CRM_V2";
let currentModule = "dashboard";
let editId = null;

let db = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
    settings:{
        supplierName:"Veltrox Technologies W.L.L.",
        supplierAddress:"Kingdom of Bahrain",
        supplierCR:"",
        supplierVAT:"",
        invoicePrefix:"INV",
        vatPercent:10
    },
    customers:[],
    leads:[],
    service:[],
    followups:[],
    invoices:[]
};

function saveDB(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
}
function uid(prefix){
    return prefix + "-" + Date.now().toString().slice(-7);
}
function today(){
    return new Date().toISOString().slice(0,10);
}
function money(value){
    return Number(value || 0).toFixed(3);
}
function getCustomer(customerId){
    return db.customers.find(c => c.customerId === customerId) || {};
}
function searchText(){
    return (document.getElementById("searchBox").value || "").toLowerCase();
}
function matchObject(obj){
    return JSON.stringify(obj).toLowerCase().includes(searchText());
}
function upsert(array, key, object){
    const index = array.findIndex(item => item[key] === object[key]);
    if(index >= 0){
        array[index] = object;
    }else{
        array.push(object);
    }
}
function escapeHtml(str){
    return String(str ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

/* ==============================
   NAVIGATION
================================= */
function setModule(moduleName){
    currentModule = moduleName;
    editId = null;

    document.querySelectorAll(".nav-btn").forEach(btn => btn.classList.remove("active"));
    const active = document.getElementById("nav-" + moduleName);
    if(active) active.classList.add("active");

    const titles = {
        dashboard:"Dashboard",
        customers:"Customer Master",
        leads:"Sales Leads",
        service:"Service Tickets",
        followups:"Follow-ups",
        invoices:"Tax Invoices",
        reports:"Reports",
        settings:"Settings / Backup"
    };

    document.getElementById("pageTitle").innerText = titles[moduleName] || "CRM";
    document.getElementById("addBtn").style.display = ["dashboard","reports","settings"].includes(moduleName) ? "none" : "inline-block";

    const addText = {
        customers:"+ Add Customer",
        leads:"+ Add Lead",
        service:"+ Add Ticket",
        followups:"+ Add Follow-up",
        invoices:"+ Add Invoice"
    };
    document.getElementById("addBtn").innerText = addText[moduleName] || "+ Add";

    render();
}

function updateCounts(){
    document.getElementById("cntCustomers").innerText = db.customers.length;
    document.getElementById("cntLeads").innerText = db.leads.length;
    document.getElementById("cntTickets").innerText = db.service.filter(x => x.serviceStatus !== "Closed").length;
    document.getElementById("cntFollowups").innerText = db.followups.filter(x => x.statusUpdate !== "Closed" && x.statusUpdate !== "Done").length;
    document.getElementById("cntInvoices").innerText = db.invoices.length;
    document.getElementById("cntInvoiceValue").innerText = money(db.invoices.reduce((sum, inv) => sum + Number(inv.totalInclVat || 0), 0));
}

function render(){
    updateCounts();
    document.getElementById("sectionActions").innerHTML = "";

    if(currentModule === "dashboard") renderDashboard();
    if(currentModule === "customers") renderCustomers();
    if(currentModule === "leads") renderLeads();
    if(currentModule === "service") renderService();
    if(currentModule === "followups") renderFollowups();
    if(currentModule === "invoices") renderInvoices();
    if(currentModule === "reports") renderReports();
    if(currentModule === "settings") renderSettings();
}

/* ==============================
   HTML HELPERS
================================= */
function table(headers, rows){
    return `
    <div class="table-wrap">
        <table>
            <thead>
                <tr>${headers.map(h => `<th>${h}</th>`).join("")}</tr>
            </thead>
            <tbody>
                ${rows || `<tr><td colspan="${headers.length}">No records found.</td></tr>`}
            </tbody>
        </table>
    </div>`;
}

function input(id,label,value="",type="text",readonly=false){
    return `
    <div>
        <label>${label}</label>
        <input id="${id}" type="${type}" value="${escapeHtml(value)}" ${readonly ? "readonly" : ""}>
    </div>`;
}
function textarea(id,label,value="",full=true){
    return `
    <div class="${full ? "full" : ""}">
        <label>${label}</label>
        <textarea id="${id}">${escapeHtml(value)}</textarea>
    </div>`;
}
function select(id,label,options,value=""){
    return `
    <div>
        <label>${label}</label>
        <select id="${id}">
            ${options.map(opt => `<option value="${escapeHtml(opt)}" ${opt === value ? "selected" : ""}>${escapeHtml(opt)}</option>`).join("")}
        </select>
    </div>`;
}
function customerSelect(value=""){
    return `
    <div>
        <label>Customer</label>
        <select id="customerId" onchange="fillCustomerDependentFields()">
            <option value="">Select Customer</option>
            ${db.customers.map(c => `<option value="${c.customerId}" ${c.customerId === value ? "selected" : ""}>${escapeHtml(c.companyName)} - ${escapeHtml(c.contactPerson)}</option>`).join("")}
        </select>
    </div>`;
}
function statusBadge(status){
    let cls = "badge";
    const s = String(status || "").toLowerCase();
    if(["overdue","lost","closed unpaid","pending"].includes(s)) cls += " red";
    if(["won","closed","paid","done","renewed"].includes(s)) cls += " green";
    if(["today","partial","follow-up","quotation sent","in progress"].includes(s)) cls += " yellow";
    if(!status) cls += " gray";
    return `<span class="${cls}">${escapeHtml(status || "-")}</span>`;
}

/* ==============================
   DASHBOARD
================================= */
function renderDashboard(){
    document.getElementById("sectionTitle").innerText = "Recent Activities";

    const activities = [
        ...db.leads.map(x => ({type:"Sales Lead",date:x.leadDate,ref:x.leadId,customerId:x.customerId,status:x.status,details:x.productService})),
        ...db.service.map(x => ({type:"Service Ticket",date:x.ticketDate,ref:x.ticketNo,customerId:x.customerId,status:x.serviceStatus,details:x.issueReported})),
        ...db.followups.map(x => ({type:"Follow-up",date:x.followupDate,ref:x.referenceId,customerId:x.customerId,status:x.statusUpdate,details:x.discussion})),
        ...db.invoices.map(x => ({type:"Tax Invoice",date:x.invoiceDate,ref:x.invoiceNo,customerId:x.customerId,status:x.paymentStatus,details:x.itemDetails}))
    ].sort((a,b) => String(b.date).localeCompare(String(a.date))).slice(0,25);

    const rows = activities.map(item => {
        const c = getCustomer(item.customerId);
        return `
        <tr>
            <td>${escapeHtml(item.date)}</td>
            <td>${escapeHtml(item.type)}</td>
            <td>${escapeHtml(c.companyName || "")}</td>
            <td>${escapeHtml(item.ref)}</td>
            <td>${escapeHtml(item.details || "")}</td>
            <td>${statusBadge(item.status)}</td>
            <td><button class="btn small" onclick="viewCustomer('${item.customerId}')">Customer History</button></td>
        </tr>`;
    }).join("");

    document.getElementById("content").innerHTML = table(["Date","Type","Company","Reference","Details","Status","Action"], rows);
}

/* ==============================
   CUSTOMER MASTER
================================= */
function renderCustomers(){
    document.getElementById("sectionTitle").innerText = "One-Time Customer Creation";

    const data = db.customers.filter(matchObject);
    const rows = data.map(c => {
        const recordCount =
            db.leads.filter(x => x.customerId === c.customerId).length +
            db.service.filter(x => x.customerId === c.customerId).length +
            db.followups.filter(x => x.customerId === c.customerId).length +
            db.invoices.filter(x => x.customerId === c.customerId).length;

        return `
        <tr>
            <td>${escapeHtml(c.customerId)}</td>
            <td>${escapeHtml(c.companyName)}</td>
            <td>${escapeHtml(c.contactPerson)}</td>
            <td>${escapeHtml(c.mobile)}</td>
            <td>${escapeHtml(c.email)}</td>
            <td>${escapeHtml(c.crNo)}</td>
            <td>${escapeHtml(c.vatNo)}</td>
            <td>${escapeHtml(c.location)}</td>
            <td>${recordCount}</td>
            <td>
                <button class="btn small" onclick="viewCustomer('${c.customerId}')">View</button>
                <button class="btn small orange" onclick="openForm('${c.customerId}')">Edit</button>
                <button class="btn small red" onclick="deleteRecord('customers','${c.customerId}')">Delete</button>
            </td>
        </tr>`;
    }).join("");

    document.getElementById("content").innerHTML = table(
        ["Customer ID","Company Name","Contact Person","Mobile","Email","CR No","VAT No","Location","Linked Records","Action"],
        rows
    );
}

/* ==============================
   SALES LEADS
================================= */
function renderLeads(){
    document.getElementById("sectionTitle").innerText = "Sales Lead Details";

    const data = db.leads.filter(matchObject);
    const rows = data.map(l => {
        const c = getCustomer(l.customerId);
        const leadAge = l.leadDate ? Math.max(0, Math.floor((new Date() - new Date(l.leadDate)) / 86400000)) : "";
        const expectedRevenue = Number(l.expectedDealValue || 0) * Number(l.closingProbability || 0) / 100;

        let alert = "";
        if(l.nextFollowupDate){
            if(l.nextFollowupDate < today()) alert = "OVERDUE";
            else if(l.nextFollowupDate === today()) alert = "TODAY";
            else alert = "UPCOMING";
        }

        return `
        <tr>
            <td>${escapeHtml(l.leadId)}</td>
            <td>${escapeHtml(l.leadDate)}</td>
            <td>${escapeHtml(c.companyName)}</td>
            <td>${escapeHtml(c.contactPerson)}</td>
            <td>${escapeHtml(c.mobile)}</td>
            <td>${escapeHtml(c.email)}</td>
            <td>${escapeHtml(l.leadSource)}</td>
            <td>${escapeHtml(l.productService)}</td>
            <td>${escapeHtml(l.requirementNotes)}</td>
            <td>${statusBadge(l.priority)}</td>
            <td>${statusBadge(l.status)}</td>
            <td>${escapeHtml(l.lastFollowupDate)}</td>
            <td>${escapeHtml(l.nextFollowupDate)}</td>
            <td>${alert ? statusBadge(alert) : ""}</td>
            <td>${leadAge}</td>
            <td>${money(l.expectedDealValue)}</td>
            <td>${escapeHtml(l.closingProbability)}%</td>
            <td>${money(expectedRevenue)}</td>
            <td>${escapeHtml(l.expectedClosingDate)}</td>
            <td>${escapeHtml(l.remarks)}</td>
            <td>${l.documentLink ? `<a href="${escapeHtml(l.documentLink)}" target="_blank">Open</a>` : ""}</td>
            <td>
                <button class="btn small purple" onclick="addFollowupFrom('Lead','${l.leadId}','${l.customerId}')">Follow-up</button>
                <button class="btn small orange" onclick="openForm('${l.leadId}')">Edit</button>
                <button class="btn small red" onclick="deleteRecord('leads','${l.leadId}')">Delete</button>
            </td>
        </tr>`;
    }).join("");

    document.getElementById("content").innerHTML = table(
        ["Lead ID","Lead Date","Company Name","Contact Person","Mobile No","Email ID","Lead Source","Product / Service","Requirement / Notes","Priority","Status","Last Follow-Up Date","Next Follow-Up Date","Follow-Up Alert","Lead Age","Expected Deal Value (BHD)","Closing Probability %","Expected Revenue (BHD)","Expected Closing Date","Remarks","Document Link","Action"],
        rows
    );
}

/* ==============================
   SERVICE TICKETS
================================= */
function renderService(){
    document.getElementById("sectionTitle").innerText = "Service Ticket Details";

    const data = db.service.filter(matchObject);
    const rows = data.map(s => {
        const c = getCustomer(s.customerId);
        return `
        <tr>
            <td>${escapeHtml(s.ticketNo)}</td>
            <td>${escapeHtml(s.ticketDate)}</td>
            <td>${escapeHtml(c.contactPerson)}</td>
            <td>${escapeHtml(c.companyName)}</td>
            <td>${escapeHtml(c.mobile)}</td>
            <td>${escapeHtml(c.email)}</td>
            <td>${escapeHtml(s.location)}</td>
            <td>${escapeHtml(s.productService)}</td>
            <td>${escapeHtml(s.issueReported)}</td>
            <td>${statusBadge(s.priority)}</td>
            <td>${escapeHtml(s.assignedEngineer)}</td>
            <td>${escapeHtml(s.startTime)}</td>
            <td>${escapeHtml(s.endTime)}</td>
            <td>${escapeHtml(s.solutionProvided)}</td>
            <td>${statusBadge(s.serviceStatus)}</td>
            <td>${money(s.serviceCharges)}</td>
            <td>${statusBadge(s.paymentStatus)}</td>
            <td>${escapeHtml(s.nextServiceReminder)}</td>

function renderReports(){
    document.getElementById("sectionTitle").innerText = "Reports";

    const totalDeal = db.leads.reduce((s,x) => s + Number(x.expectedDealValue || 0), 0);
    const expectedRevenue = db.leads.reduce((s,x) => s + (Number(x.expectedDealValue || 0) * Number(x.closingProbability || 0) / 100), 0);
    const invoiceValue = db.invoices.reduce((s,x) => s + Number(x.totalInclVat || 0), 0);
    const pendingInvoice = db.invoices.filter(x => x.paymentStatus !== "Paid").reduce((s,x) => s + Number(x.totalInclVat || 0), 0);

    document.getElementById("content").innerHTML = `
        <div class="cards">
            <div class="card"><div class="card-title">Total Deal Value</div><div class="card-value">${money(totalDeal)} BHD</div></div>
            <div class="card"><div class="card-title">Expected Revenue</div><div class="card-value">${money(expectedRevenue)} BHD</div></div>
            <div class="card"><div class="card-title">Total Invoice Value</div><div class="card-value">${money(invoiceValue)} BHD</div></div>
            <div class="card"><div class="card-title">Pending Invoice Value</div><div class="card-value">${money(pendingInvoice)} BHD</div></div>
        </div>
        <hr>
        <h3>Today / Overdue Follow-ups</h3>
        ${renderFollowupAlertTable()}
    `;
}

function renderFollowupAlertTable(){
    const leadAlerts = db.leads
        .filter(x => x.nextFollowupDate && x.nextFollowupDate <= today() && x.status !== "Won" && x.status !== "Lost")
        .map(x => {
            const c = getCustomer(x.customerId);
            return `<tr><td>Lead</td><td>${x.leadId}</td><td>${c.companyName}</td><td>${x.nextFollowupDate}</td><td>${x.status}</td></tr>`;
        }).join("");

    const serviceAlerts = db.service
        .filter(x => x.nextServiceReminder && x.nextServiceReminder <= today() && x.serviceStatus !== "Closed")
        .map(x => {
            const c = getCustomer(x.customerId);
            return `<tr><td>Service</td><td>${x.ticketNo}</td><td>${c.companyName}</td><td>${x.nextServiceReminder}</td><td>${x.serviceStatus}</td></tr>`;
        }).join("");

    return table(["Type","Reference","Company","Due Date","Status"], leadAlerts + serviceAlerts);
}

    const vatPercent = Number(document.getElementById("vatPercent").value || 0);

    upsert(db.invoices,"invoiceNo",{
        invoiceNo:document.getElementById("invoiceNo").value,
        invoiceDate:document.getElementById("invoiceDate").value,
        customerId:cid,
        quotationNo:document.getElementById("quotationNo").value,

        remarks:document.getElementById("invoiceRemarks").value
    });

function deleteRecord(module,id){
    if(!confirm("Delete this record?")) return;

    const keyMap = {
        customers:"customerId",
        leads:"leadId",
        service:"ticketNo",
        followups:"followupId",
        invoices:"invoiceNo"
    };

    db[module] = db[module].filter(x => x[keyMap[module]] !== id);
    saveDB();
    render();
}

function miniTable(headers, rows){
    if(!rows.length) return `<p class="small-text">No records found.</p>`;
    const rowHtml = rows.map(r => `<tr>${r.map(v => `<td>${escapeHtml(v)}</td>`).join("")}</tr>`).join("");
    return table(headers, rowHtml);
}

    `;

    document.getElementById("viewModal").style.display = "flex";
}

/* ==============================
   BACKUP
================================= */
function exportBackup(){
    const blob = new Blob([JSON.stringify(db,null,2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "veltrox-crm-backup.json";
    a.click();
}

function importBackup(){
    const file = document.getElementById("backupFile").files[0];
    if(!file){
        alert("Please select backup JSON file.");
        return;
    }

    const reader = new FileReader();
    reader.onload = function(e){
        try{
            const imported = JSON.parse(e.target.result);
            if(!imported.customers || !imported.leads){
                alert("Invalid backup file.");
                return;
            }
            db = imported;
            saveDB();
            render();
            alert("Backup imported successfully.");
        }catch(err){
            alert("Import failed: " + err.message);
        }
    };
    reader.readAsText(file);
}

function clearAllData(){
    if(confirm("This will delete all CRM data from this browser. Continue?")){
        localStorage.removeItem(STORAGE_KEY);
        location.reload();
    }
}

   INIT
================================= */
setModule("dashboard");
